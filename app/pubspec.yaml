name: mio_notice
description: 명지전문대학 공지사항 모아보기
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  app_links: ^6.3.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.2
  share_plus: ^10.1.3
  cp949_codec: ^1.0.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  excel: ^4.0.6
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  remove_alpha_ios: true
  # Android adaptive icon (원형 마스크에 맞추려면 로고에 안전 여백 권장)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
  assets:
    - assets/images/
    - assets/licenses/
    - assets/data/
