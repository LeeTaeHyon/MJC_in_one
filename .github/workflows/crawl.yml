name: MJC Crawler

on:
  schedule:
    - cron: '0 0,3,6,9 * * *'   # KST 09:00, 12:00, 15:00, 18:00 (UTC+9)
  workflow_dispatch:          # 수동 실행 버튼
    inputs:
      mode:
        description: 'crawl mode'
        default: 'incremental'
        type: choice
        options: [incremental, full]

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      - name: Setup Firebase credentials
        working-directory: test
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "::error::GitHub Actions secret FIREBASE_KEY 가 설정되지 않았습니다."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: FIREBASE_KEY"
            echo "Value: test/serviceAccountKey.json 파일 내용 전체(JSON)"
            exit 1
          fi
          printf '%s' "$FIREBASE_KEY" > serviceAccountKey.json
          python -c "import json; json.load(open('serviceAccountKey.json', encoding='utf-8'))"

      - name: Run crawler
        working-directory: test
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRAWL_MODE: ${{ github.event.inputs.mode || 'incremental' }}
        run: |
          python crawler_mjc.py
          python crawler_schedule.py
          python crawler_mpu.py
          python crawler_ctl.py
