<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MJC ONE 로그인</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #5f6b7a;
        --line: #d9e1ec;
        --primary: #0d47a1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --card: #181c22;
          --text: #eef2f8;
          --muted: #b7c0ce;
          --line: #303844;
          --primary: #8ab4f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(480px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: var(--muted);
      }

      a.button {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MJC ONE 로그인</h1>
      <p>
        이메일 로그인은 <strong>모바일 앱</strong>에서 완료해야 합니다.
        아래 버튼으로 앱을 열거나, 이미 설치되어 있다면 메일의 링크를 다시
        눌러 주세요.
      </p>
      <a class="button" href="mjcinone://login">앱에서 열기</a>
    </main>
  </body>
</html>
